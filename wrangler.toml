workers_dev = true
preview_urls = false

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://vincent-shin.github.io,http://localhost:5173"
GEMINI_MODEL = "gemini-2.5-flash"

[[d1_databases]]
binding = "PORTFOLIO_DB"
database_name = "vincent-portfolio-telemetry"
database_id = "d8c53e90-0100-47a9-a075-c1e313822606"
migrations_dir = "cloudflare/migrations"
