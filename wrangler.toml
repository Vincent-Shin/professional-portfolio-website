name = "vincent-portfolio-chatbot"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-03-01"

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://vincent-shin.github.io"
GEMINI_MODEL = "gemini-2.5-flash"

[[d1_databases]]
binding = "PORTFOLIO_DB"
database_name = "vincent-portfolio-telemetry"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
